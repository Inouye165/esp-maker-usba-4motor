[env:esp32-s3-devkitc-1]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Use native ESP32-S3 Hardware USB-Serial/JTAG controller (303a:1001 / /dev/ttyACM0)
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D VL53L7CX_DISABLE_AMBIENT_PER_SPAD
    -D VL53L7CX_DISABLE_NB_SPADS_ENABLED
    -D VL53L7CX_DISABLE_RANGE_SIGMA_MM
    -D VL53L7CX_DISABLE_REFLECTANCE_PERCENT
    -D VL53L7CX_DISABLE_MOTION_INDICATOR
    -Wl,--wrap=_ZN8VL53L7CX7RdMultiEP17VL53L7CX_PlatformtPhj
    -Wl,--wrap=_ZN8VL53L7CX7WrMultiEP17VL53L7CX_PlatformtPhj
    -Wl,--wrap=_ZN8VL53L4CD16VL53L4CD_I2CReadEhtPhj
    -Wl,--wrap=_ZN8VL53L4CD17VL53L4CD_I2CWriteEhtPhj

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    stm32duino/STM32duino VL53L7CX @ ^1.0.3
    stm32duino/STM32duino VL53L4CD @ ^1.0.3
